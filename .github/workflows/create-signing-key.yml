name: Create signing key

# Generates a fresh release keystore for Off and hands back the ONE value that
# cannot be typed by hand: the base64 of the keystore file.
#
# Why it works this way (please read):
#   This repository is public, so anything a workflow PRINTS lands in the run
#   log, and anything it UPLOADS lands in an artifact — both readable by anyone
#   who can read the repo. So this workflow never prints and never uploads the
#   password. You supply the password yourself as a repository SECRET before
#   running it, and the workflow only ever echoes back the keystore file.
#
# Order of operations:
#   1. Add repository secrets  KEYSTORE_PASSWORD  and  KEY_PASSWORD
#      (use the SAME value for both — at least 6 characters).
#   2. Run this workflow (Actions -> Create signing key -> Run workflow).
#   3. Download the "signing-key-base64" artifact and open KEYSTORE_BASE64.txt.
#   4. Add repository secret  KEYSTORE_BASE64  = the whole contents of that file.
#   5. Add repository secret  KEY_ALIAS        = the alias you used (default: off).
#   6. Delete this workflow run so the artifact disappears (it expires in 1 day anyway).
#
# After that, every "Build Off Android APK" run signs the release APK for you.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias to store in the keystore (default: off)"
        required: false
        default: "off"

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check the password secrets exist
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Repository secret KEYSTORE_PASSWORD is not set. Set KEYSTORE_PASSWORD (and KEY_PASSWORD, usually the same value) before running this workflow."
            exit 1
          fi
          if [ "${#KEYSTORE_PASSWORD}" -lt 6 ]; then
            echo "::error::KEYSTORE_PASSWORD must be at least 6 characters (Java keystores require it)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate the keystore
        env:
          ALIAS: ${{ inputs.key_alias }}
        run: |
          set -e
          NAME="${ALIAS:-off}"
          keytool -genkeypair -v \
            -keystore off-release.jks \
            -alias "$NAME" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
            -dname "CN=Off, OU=Off, O=Off, L=Unknown, ST=Unknown, C=IN"
          base64 -w0 off-release.jks > KEYSTORE_BASE64.txt
          echo "keystore bytes: $(wc -c < off-release.jks)"
          echo "base64 chars:   $(wc -c < KEYSTORE_BASE64.txt)"

      - name: Upload the keystore as base64
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-base64
          path: KEYSTORE_BASE64.txt
          retention-days: 1

      - name: What to do next
        env:
          ALIAS: ${{ inputs.key_alias }}
        run: |
          {
            echo "## Signing key created"
            echo ""
            echo "Download the **signing-key-base64** artifact and open \`KEYSTORE_BASE64.txt\`."
            echo ""
            echo "Then add these repository secrets (Settings -> Secrets and variables -> Actions):"
            echo ""
            echo "| Secret | Value |"
            echo "|---|---|"
            echo "| \`KEYSTORE_BASE64\` | the whole contents of \`KEYSTORE_BASE64.txt\` |"
            echo "| \`KEYSTORE_PASSWORD\` | already set — the value you entered |"
            echo "| \`KEY_PASSWORD\` | already set — the value you entered |"
            echo "| \`KEY_ALIAS\` | \`${ALIAS:-off}\` |"
            echo ""
            echo "Finally, delete this run (Actions -> this run -> Delete run) so the artifact goes away."
            echo ""
            echo "**Keep a copy of the keystore and the password somewhere safe.** If they are lost, an"
            echo "app that is already installed on a phone can never be updated — it would have to be"
            echo "uninstalled and installed again."
            echo ""
            echo "The password was never printed here and never uploaded — only the keystore file was."
          } >> "$GITHUB_STEP_SUMMARY"
