name: Build Off Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set these repository secrets to have CI produce a signed APK.
      #   KEYSTORE_BASE64   base64 -w0 off-release.jks
      #   KEYSTORE_PASSWORD store password
      #   KEY_PASSWORD      key password
      #   KEY_ALIAS         key alias (e.g. off)
      # When they are present the signed APK is the artifact; the unsigned APK
      # is only uploaded as a fallback when they are absent.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Sign release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/off-release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=app/build/outputs/apk/release
          "$BT/zipalign" -p -f 4 "$OUT/app-release-unsigned.apk" "$OUT/app-release-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/off-release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$OUT/app-release-signed.apk" \
            "$OUT/app-release-aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT/app-release-signed.apk"

      - name: Upload signed APK artifact
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: Off-v3.7.0-apk
          path: app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned APK artifact (no signing secrets set)
        if: env.KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: Off-v3.7.0-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
