name: Build Off Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: r27c
      FFMPEG_VERSION: n7.1.1
      # Set these repository secrets to have CI produce a signed APK.
      #   KEYSTORE_BASE64   base64 -w0 off-release.jks
      #   KEYSTORE_PASSWORD store password
      #   KEY_PASSWORD      key password
      #   KEY_ALIAS         key alias (e.g. off)
      # When they are present the signed APK is the artifact; the unsigned APK
      # is only uploaded as a fallback when they are absent.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select the build Python interpreter
        run: |
          PY="$(command -v python3.11 || command -v python3)"
          "$PY" --version
          echo "BUILD_PYTHON=$PY" >> "$GITHUB_ENV"

      - name: Cache the NDK and the FFmpeg source
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ndk.zip
            /tmp/ffsrc
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-ndk-${{ env.NDK_VERSION }}

      # yt-dlp needs a real ffmpeg executable to merge separate video and audio
      # streams. It ships as libffmpeg.so / libffprobe.so so Android extracts it
      # somewhere the app is allowed to execute it.
      - name: Build FFmpeg for Android arm64
        run: |
          set -euo pipefail
          if [ ! -f /tmp/ndk.zip ]; then
            curl -sL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          fi
          rm -rf /tmp/ndk && mkdir -p /tmp/ndk
          unzip -q /tmp/ndk.zip -d /tmp/ndk
          if [ ! -d "/tmp/ffsrc/FFmpeg-${FFMPEG_VERSION}" ]; then
            mkdir -p /tmp/ffsrc
            curl -sL -o /tmp/ff.tar.gz "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/${FFMPEG_VERSION}.tar.gz"
            tar -xzf /tmp/ff.tar.gz -C /tmp/ffsrc
          fi
          NDK_DIR="/tmp/ndk/android-ndk-${NDK_VERSION}" \
          FFMPEG_SRC="/tmp/ffsrc/FFmpeg-${FFMPEG_VERSION}" \
            bash scripts/build-ffmpeg-android.sh
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "/tmp/ffsrc/FFmpeg-${FFMPEG_VERSION}/ffmpeg"  app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          cp "/tmp/ffsrc/FFmpeg-${FFMPEG_VERSION}/ffprobe" app/src/main/jniLibs/arm64-v8a/libffprobe.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Sign release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/off-release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=app/build/outputs/apk/release
          "$BT/zipalign" -p -f 4 "$OUT/app-release-unsigned.apk" "$OUT/app-release-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/off-release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$OUT/app-release-signed.apk" \
            "$OUT/app-release-aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT/app-release-signed.apk"

      - name: Upload signed APK artifact
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: Off-v4.0.1-apk
          path: app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned APK artifact (no signing secrets set)
        if: env.KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: Off-v4.0.1-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
